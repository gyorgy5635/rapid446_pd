name: controls_rack_to_ot2

metadata:
  author: Abe Stroka
  info: Workflow for transfering controls plate from rack straight to ot2 nest 1 (skips the Flex)
  version: '0.1'

steps:
  - name: transfer
    node: pf400_piper
    action: transfer
    locations:
      source: rack1_row3_nest1
      target: exchange_narrow
    comment: place plate on exchange

  - name: transfer
    node: pf400_piper
    action: transfer
    locations:
      source: exchange_wide
      target: ot2_patrick.deck_nest_1
    comment: place controls plate on ot2 nest 1
